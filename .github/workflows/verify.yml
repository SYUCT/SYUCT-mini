name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 JS 语法
        run: find miniprogram scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: 课表与分享回归测试
        run: node scripts/test-timetable.js

      - name: 安装校验依赖
        run: |
          python3 -m pip install --quiet brotli

      - name: 运行同步与包体校验
        run: |
          python3 scripts/verify-sync.py
          python3 scripts/verify-pdfs.py
          python3 scripts/verify-require.py
